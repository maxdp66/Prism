name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Prism
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Build
        run: >-
          xcodebuild
          -project Prism.xcodeproj
          -scheme Prism
          -destination 'platform=macOS'
          -configuration Release
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          -quiet
          build

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/
